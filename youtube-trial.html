<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>유튜브 음원 추출 시험 — 파일서랍</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/audio.css"><script src="/youtube-trial.js" defer></script><style>main{max-width:760px;padding:32px 20px}h1{font-size:clamp(24px,5vw,36px)}.audio-card{padding:24px;border:1px solid #d9dfd3;border-radius:18px;background:#fff}p{line-height:1.8}label{display:block}input[type=url],input[type=password]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbc7b4;border-radius:8px;font:inherit}button,#trial-download{padding:12px 18px;border:0;border-radius:9px;background:#365c34;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}#trial-download:not([hidden]){display:inline-block}a{color:#365c34}</style></head><body><main class="shell"><p><a href="/audio">← 영상 파일 음원 추출</a></p><h1>유튜브 음원 추출 · 비공개 시험</h1><section class="audio-card"><p>최대 5분 영상 한 개를 MP3로 추출합니다. 성공 시 영상 길이 1분당 무료 크레딧 1개가 사용됩니다(올림).</p><p>입력한 링크는 Cloudflare를 통해 SocialKit에 전달되며, 변환 파일은 업체의 임시 저장소에서 내려받습니다.</p><form id="trial-form"><p><label for="trial-code">시험용 접근 코드 (API 키가 아닙니다)</label><input id="trial-code" type="password" autocomplete="off" required></p><p><label for="youtube-url">유튜브 영상 주소</label><input id="youtube-url" type="url" required placeholder="https://www.youtube.com/watch?v=..."></p><p><label><input id="rights" type="checkbox" required> 내가 만든 영상이거나 이용 허락을 받은 영상입니다.</label></p><button id="trial-start" type="submit">MP3 추출 시험</button></form><p id="trial-status" role="status" aria-live="polite"></p><button id="trial-resume" hidden>기존 작업 상태 다시 확인</button><a id="trial-download" hidden target="_blank" rel="noopener noreferrer">MP3 다운로드</a><p>새 변환을 반복 요청하면 크레딧이 추가 사용됩니다. 링크는 약 1시간 동안 유효합니다. 일반 공개용 기능이 아닙니다.</p></section></main></body></html>
